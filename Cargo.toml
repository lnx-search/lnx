[workspace]
resolver = "2"
members = [
    "lnx",
    "lnx-common",
    "lnx-fs",
    "lnx-fs/lnx-fs-benches",
    "lnx-query",
    "lnx-server",
    "lnx-shell",
    "lnx-doc",
    "lnx-tantivy",
    "lnx-config",
    "lnx-tantivy",
    "lnx-page-store",
]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
arc-swap = "1.7"
tracing = "0.1"
serde_json = "1"
serde_derive = "1"
rmp-serde = "1.3"
serde = "1"
flume = "0.11"
bon = "3"
futures-util = "0.3"
futures-lite = "2.5"
bytes = "1"
fnv = "1"
ahash = "0.8"
parking_lot = "0.12"
bytemuck = "1.19"
cityhasher = "0.1.0"
stable_deref_trait = "1.2"
fastrand = "2.3"
humansize = "2.1"
crc32fast = "1.4"
mockall = "0.13"
smallvec = "1.13"
rayon = "1.10.0"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
i2o2 = "0.2"
glommio = "0.9.0"
offset-allocator = "0.2.0"

# Encryption at rest
chacha20poly1305 = "0.10"
sha2 = "0.10.9"
hmac = "0.12"

# Dev Dependencies
rstest = "0.23"
tempfile = "3.14"
fail = "0.5.1"

moka = { version = "0.12", features = ["sync"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
mimalloc = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
poem = { version = "3", features = ["anyhow"] }
poem-openapi = { version = "5.1", features = ["redoc", "url", "humantime"] }
url = { version = "2.5", features = ["serde"] }
ulid = { version = "1.1.3", features = ["serde"] }
tantivy = { git = "https://github.com/ChillFish8/tantivy.git", branch = "lnx-dev", default-features = false, features = ["async"] }
sqlx = { version = "0.8.2", default-features = false, features = ["sqlite", "macros", "runtime-tokio"] }
opendal = { version = "0.50.2", default-features = false }
rend = { version = "0.5.2", features = ["bytemuck-1"] }
rkyv = { version = "0.8.8", features = ["little_endian", "pointer_width_32"] }
chrono = { version = "0.4.38" }
memmap2 = { git = "https://github.com/lnx-search/memmap2-rs.git", rev = "b4e936e" }

[patch.crates-io]
memmap2 = { git = "https://github.com/lnx-search/memmap2-rs.git", rev = "b4e936e" }
