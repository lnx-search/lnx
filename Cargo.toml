[workspace]
resolver = "2"
members = [
    "lnx-engine/engine",
    "lnx-engine/aexecutor",
    "lnx-engine/search-index",
    "lnx-server",
    "lnx-rest",
    "lnx-types",
]

[profile.release]
lto = "fat"
codegen-units = 1

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = "1"
serde_derive = "1"
serde_json = "1"

ulid = { version = "1.1.3", features = ["serde"] }
poem = { version = "3.0.1", features = ["anyhow"] }
poem-openapi = { version = "5.0.2", features = ["redoc", "uuid"] }

lnx-types = { version = "0.1", path = "lnx-types" }