[workspace]
resolver = "2"
members = [
    "lnx",
    "lnx-common",
    "lnx-query",
    "lnx-server",
    "lnx-config",
]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
serde_json = "1"
serde_derive = "1"
rmp-serde = "1"
serde = "1"
bon = "3"
futures-lite = "2"
bytes = "1"
foldhash = "0.2"
parking_lot = "0.12"
stable_deref_trait = "1"
humansize = "2"
smallvec = "1"
rayon = "1"

# Dev Dependencies
rstest = "0.26"
tempfile = "3"

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
mimalloc = { version = "0.1", default-features = false, features = ["v3"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
poem = { version = "3.1", features = ["anyhow"] }
poem-openapi = { version = "5.1", features = ["redoc", "url", "humantime"] }
url = { version = "2", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
tantivy = { git = "https://github.com/ChillFish8/tantivy.git", branch = "lnx-dev", default-features = false, features = ["async"] }
opendal = { version = "0.50.2", default-features = false }
rend = { version = "0.5.2", features = ["bytemuck-1"] }
rkyv = { version = "0.8.8", features = ["little_endian", "pointer_width_32"] }
chrono = { version = "0.4.38" }
lnx-vfs = { git = "https://github.com/lnx-search/lnx-vfs.git", rev = "4d64fe5" }