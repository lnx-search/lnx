[workspace]
resolver = "2"
members = [
    "lnx",
    "lnx-common",
    "lnx-fs",
    "lnx-fs/lnx-fs-benches",
    "lnx-query",
    "lnx-server",
    "lnx-shell",
    "lnx-doc",
    "lnx-tantivy",
]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
serde_json = "1"
serde_derive = "1"
rmp-serde = "1.3.0"
serde = "1"
glommio = "0.9.0"
flume = "0.11.1"
bon = "3"
futures-util = "0.3.31"
futures-lite = "2.5.0"
bytes = "1.8.0"
fnv = "1"
ahash = "0.8.11"
parking_lot = "0.12.3"
bytemuck = "1.19"
cityhasher = "0.1.0"
stable_deref_trait = "1.2.0"
fastrand = "2.3.0"
humansize = "2.1.3"
crc32fast = "1.4.2"
mockall = "0.13.1"
smallvec = "1.13.2"
rayon = "1.10.0"
fst = "0.4.7"

# Dev Dependencies
rstest = "0.23.0"
tempfile = "3.14.0"

moka = { version = "0.12.8", features = ["sync"] }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
mimalloc = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
poem = { version = "3.1", features = ["anyhow"] }
poem-openapi = { version = "5.1", features = ["redoc", "url", "humantime"] }
url = { version = "2.5", features = ["serde"] }
ulid = { version = "1.1.3", features = ["serde"] }
sqlparser = { version = "0.52.0", features = ["sqlparser_derive"] }
tantivy = { git = "https://github.com/ChillFish8/tantivy.git", branch = "lnx-dev", default-features = false, features = ["async"] }
sqlx = { version = "0.8.2", default-features = false, features = ["sqlite", "macros", "runtime-tokio"] }
opendal = { version = "0.50.2", default-features = false }
rend = { version = "0.5.2", features = ["bytemuck-1"] }
rkyv = { version = "0.8.8", features = ["little_endian", "pointer_width_32"] }
chrono = { version = "0.4.38" }